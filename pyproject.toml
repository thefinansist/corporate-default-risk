[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-default-risk"
version = "1.0.0"
description = "Explainable corporate default-risk screening from Russian accounting statements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "openpyxl>=3.1,<4.0"
]

[project.optional-dependencies]
jupyter = ["jupyterlab>=4.0,<5.0", "ipykernel>=6.0,<7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

